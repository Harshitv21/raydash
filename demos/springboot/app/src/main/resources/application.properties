spring.application.name=app
spring.datasource.url=jdbc:postgresql://localhost:5432/raydash_demo_application_db

spring.datasource.username=raydash_demo_user
spring.datasource.password=raydash

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#raydash
raydash.host=127.0.0.1
raydash.port=13203
raydash.default-ttl-seconds=300